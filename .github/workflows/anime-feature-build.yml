name: Build Cauldron Anime Feature

on:
  workflow_dispatch:
  push:
    branches:
      - feature/anime-stream-support

permissions:
  contents: read
  packages: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Compile source
        run: python -m compileall -q app
      - name: Run tests
        run: pytest -q
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/peden88/cauldron:anime-test
            ghcr.io/peden88/cauldron:anime-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
